name: Build Python

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: docker  # Sollte zum Label 'docker:docker://node:20-bookworm' passen

    steps:
      - name: Checkout code
        uses: https://code.forgejo.org/actions/checkout@v4


      - name: Dependencies installieren
        run: |
          pip install nuitka

      - name: Binary bauen
        run: |
          nuitka --standalone Start-Ui.py

      - name: Upload
        uses: https://code.forgejo.org/actions/upload-artifact@v4
        with:
          name: python-build
          path: Start-Ui.dist