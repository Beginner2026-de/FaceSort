name: Build Python

on:
  push:
    branches:
      - master  # 👈 Dein Branch heißt master, nicht main!
  workflow_dispatch:  # 👈 Für manuelles Starten

jobs:
  build:
    runs-on: docker  # 👈 Ändere hier auf 'docker' statt 'ubuntu-latest'
    
    steps:
      - uses: actions/checkout@v4

      - name: Python installieren (für Alpine Linux)
        run: |
          apk add --no-cache python3 py3-pip

      - name: Dependencies installieren
        run: |
          pip install nuitka

      - name: Binary bauen
        run: |
          nuitka --standalone Start-Ui.py

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: python-build
          path: Start-Ui.dist