name: Build Python

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: docker

    steps:
      - uses: actions/checkout@v4

      - name: Python installieren
        run: |
          apk add --no-cache python3 py3-pip

      - name: Dependencies installieren
        run: |
          pip install nuitka

      - name: Binary bauen
        run: |
          nuitka Start-Ui.py

      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: python-build
          path: dist/main