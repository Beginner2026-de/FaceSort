name: Build Windows Installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:

  build-windows-installer:
    runs-on: windows-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read project version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content project.env | Select-String '^VERSION=').ToString().Split('=', 2)[1].Trim()

          if (-not $version) {
            Write-Error "VERSION wurde nicht in project.env gefunden!"
            exit 1
          }

          "version=$version" >> $env:GITHUB_OUTPUT

          Write-Host "Project version: $version"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"
          cache: "pip"
          cache-dependency-path: requirements-windows.txt

      - name: Prepare Nuitka cache
        shell: pwsh
        run: |
          $cacheDir = "$env:GITHUB_WORKSPACE\.nuitka-cache-windows"
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null

          "NUITKA_CACHE_DIR=$cacheDir" >> $env:GITHUB_ENV

      - name: Cache Nuitka
        id: cache-nuitka
        uses: actions/cache@v4
        with:
          path: .nuitka-cache-windows
          key: ${{ runner.os }}-nuitka-${{ hashFiles('requirements-windows.txt') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-

      - name: Install build tools
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt
          python -m pip install nuitka

      - name: Show cache status
        shell: pwsh
        run: |
          Write-Host "Nuitka cache hit: ${{ steps.cache-nuitka.outputs.cache-hit }}"

      - name: Build Windows installer
        shell: pwsh
        run: |
          python build_and_make_instaler.py

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/FaceSort-Setup-*.exe

  build-linux-appimage:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read project version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^VERSION=' project.env | cut -d '=' -f2-)

          if [ -z "$VERSION" ]; then
            echo "VERSION wurde nicht in project.env gefunden!"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-linux.txt
          python -m pip install nuitka

      - name: Install AppImage tools
        run: |
          wget -O appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage

          chmod +x appimagetool

          sudo mv appimagetool /usr/local/bin/appimagetool

          appimagetool --help

      - name: Build FaceSort
        run: |
          python build_and_make_instaler.py

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/FaceSort-*.AppImage

  release:
    needs:
      - build-windows-installer
      - build-linux-appimage

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows installer
        uses: actions/download-artifact@v5
        with:
          name: windows-installer
          path: release

      - name: Download Linux AppImage
        uses: actions/download-artifact@v5
        with:
          name: linux-appimage
          path: release

      - name: Show release files
        run: |
          echo "Files that will be uploaded:"
          ls -lah release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-windows-installer.outputs.version }}
        run: |
          echo "Creating release $VERSION"

          gh release create "$VERSION" \
            release/FaceSort-Setup-*.exe \
            release/FaceSort-*.AppImage \
            --repo "${{ github.repository }}" \
            --title "FaceSort $VERSION" \
            --generate-notes