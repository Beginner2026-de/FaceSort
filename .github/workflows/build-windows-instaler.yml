name: Build Windows Installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:

  build:
    runs-on: windows-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read project version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content project.env | Select-String '^VERSION=').ToString().Split('=', 2)[1].Trim()

          if (-not $version) {
            Write-Error "VERSION wurde nicht in project.env gefunden!"
            exit 1
          }

          "version=$version" >> $env:GITHUB_OUTPUT

          Write-Host "Project version: $version"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"
          cache: "pip"
          cache-dependency-path: requirements-windows.txt

      - name: Prepare Nuitka cache
        shell: pwsh
        run: |
          $cacheDir = "$env:GITHUB_WORKSPACE\.nuitka-cache-windows"
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null

          "NUITKA_CACHE_DIR=$cacheDir" >> $env:GITHUB_ENV

      - name: Cache Nuitka
        id: cache-nuitka
        uses: actions/cache@v4
        with:
          path: .nuitka-cache-windows
          key: ${{ runner.os }}-nuitka-${{ hashFiles('requirements-windows.txt') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-

      - name: Install build tools
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

          python -m pip install --upgrade pip
          # python -m pip install -r requirements-windows.txt
          python -m pip install nuitka

      - name: Show cache status
        shell: pwsh
        run: |
          Write-Host "Nuitka cache hit: ${{ steps.cache-nuitka.outputs.cache-hit }}"

      - name: Build Windows installer
        shell: pwsh
        run: |
          python build_and_make_instaler.py

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/FaceSort-Setup-*.exe

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows installer
        uses: actions/download-artifact@v5
        with:
          name: windows-installer
          path: release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          echo "Creating release $VERSION"

          gh release create "$VERSION" \
            release/FaceSort-Setup-*.exe \
            --repo "${{ github.repository }}" \
            --title "FaceSort $VERSION" \
            --generate-notes